#
# Site Settings
#
title: Eren Soylu
tagline: control - software - energy systems
description: >- # used by search engines
  Control Systems Architect working on automotive powertrain software. Writing on control systems, embedded software, and energy systems engineering.
social_preview_image: /assets/img/default-og.jpg
# The subpath of your site, e.g. /blog
baseurl: ""

# The base hostname & protocol for your site, e.g. http://localhost:4000
url: "https://erensoylu.com"

author:
  name: Eren Soylu
  github: ernsoylu

github:
  username: ernsoylu

social:
  name: Eren Soylu
  email: "" # fill in a contact email
  links:
    - https://github.com/ernsoylu
    - https://uk.linkedin.com/in/erensoylu

#
# Theme Settings
#
theme: jekyll-theme-chirpy

# Simple or Elegant
theme_mode: "" # [light|dark] - leave empty so both themes compile and the toggle stays available; dark is the primary design, light follows system preference

lang: en-GB
timezone: Europe/London

#
# Collections
#
collections:
  tabs:
    output: true
    sort_by: order

#
# Front Matter Defaults
#
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      comments: false

#
# Plugins
#
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

#
# Permalinks
#
permalink: /:year/:month/:day/:title/

#
# Pagination
#
paginate: 10
paginate_path: "/page:num/"

#
# Markdown
#
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

#
# Exclude from processing
#
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .jekyll-cache
  - .sass-cache
  - .gemini
  - .claude
  - README.md
  - LICENSE
  - docs
  - .github
  - _scripts

#
# Chirpy Settings
#

# Privacy-friendly, no Google Analytics. Sign up at goatcounter.com and fill in the id.
analytics:
  goatcounter:
    id: "" # fill in your GoatCounter id

# GitHub Discussions-backed comments. Set up at giscus.app, fill in the fields below,
# then flip `comments: true` on individual posts to enable.
comments:
  provider: giscus
  giscus:
    repo: "" # fill in "username/repo"
    repo_id: ""
    category: ""
    category_id: ""

#
# Last Modification Date for each post
#
lastmod:
  enabled: true

#
# Avatar Settings
#
avatar: /assets/img/avatar.jpg
